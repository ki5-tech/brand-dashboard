.tabs{display:flex;gap:5px;margin-bottom:14px;flex-wrap:wrap}

function RR(m,a,b,c,d,e,f,g,h,i){return{m,시공결과:a,청구:b,청구율:c,지급:d,공제:e,최종지급:f,지급율:g,공헌이익:h,공헌율:i}}

// ===== parseCSV: 실제 구글시트 CSV 구조에 맞게 작성 =====
function parseCSV(text) {
  // 큰따옴표 안의 콤마 올바르게 처리
  function parseLine(line) {
    const result = []; let cur = "", inQ = false;
    for (let i = 0; i < line.length; i++) {
      const c = line[i];
      if (c === '"') { inQ = !inQ; }
      else if (c === ',' && !inQ) { result.push(cur.trim()); cur = ""; }
      else { cur += c; }
    }
    result.push(cur.trim());
    return result;
  }
  // 숫자 변환: "-" → 0, "(29)" → -29
  function toNum(s) {
    if (!s || s === "-" || s === "" || s === "(-)") return 0;
    const neg = s.match(/^\((\d[\d.,]*)\)$/);
    if (neg) return -parseFloat(neg[1].replace(/,/g,""));
    const v = parseFloat(s.replace(/,/g,"").replace(/%/g,""));
    return isNaN(v) ? 0 : v;
  }
  // % 변환: 0.077 → 7.70, 7.70% → 7.70, (20.28) → -20.28
  function pct(s) {
    if (!s || s === "-" || s === "" || s === "(-)") return 0;
    s = s.trim();
    // (숫자) 형식 → 음수
    const neg = s.match(/^\(([\d.,]+)\)$/);
    if (neg) {
      const v = parseFloat(neg[1].replace(/,/g,""));
      return isNaN(v) ? 0 : parseFloat((-v).toFixed(2));
    }
    // % 기호 있으면 그대로
    if (s.includes("%")) {
      const v = parseFloat(s.replace(/%/g,"").replace(/,/g,""));
      return isNaN(v) ? 0 : parseFloat(v.toFixed(2));
    }
    const v = parseFloat(s.replace(/,/g,""));
    if (isNaN(v)) return 0;
    // 소수(0.xxx)면 ×100
    if (Math.abs(v) < 1) return parseFloat((v * 100).toFixed(2));
    // 이미 % 값이면 그대로
    return parseFloat(v.toFixed(2));
  }

  const lines = text.split("\n");
  const result = {};
  let cur = null, hdr = false;

  // 브랜드 매핑 (실제 CSV 헤더 형식 기준)
  const brandMap = [
    { re:/라스트마일.*마감/, name:"레터스 전체" },
    { re:/^\[퍼시스\]$/, name:"퍼시스" },
    { re:/^\[시디즈\]/, name:"시디즈·알로소" },
    { re:/^\[일룸\]/, name:"일룸·데스커·슬로우베드" },
    { re:/^\[AS\]$/, name:"AS" },
    { re:/^\[외부화주사\]$/, name:"외부화주사" },
  ];

  for (const line of lines) {
    if (!line.trim()) continue;
    const row = parseLine(line);
    const first = row[0].trim();
    const joined = row.join("").trim();

    // 브랜드 섹션 감지
    let matched = false;
    for (const {re, name} of brandMap) {
      if (re.test(first) || re.test(joined)) {
        cur = name; result[cur] = []; hdr = false; matched = true; break;
      }
    }
    if (matched) continue;

    // 헤더 행 ("구분" 포함된 행)
    if (first === "구분" || (first === "" && row.some(c=>c.trim()==="구분"))) { hdr = true; continue; }
    if (!cur || !hdr) continue;

    // 날짜: "24-1월", "24-12월", "25-01월" 모두 처리
    const mc = first.match(/^(\d{2})-0?(\d{1,2})월?$/);
    if (!mc) continue;
    const m = `${mc[1]}-${mc[2].padStart(2,"0")}`;

    const 시공결과=toNum(row[1]), 청구=toNum(row[2]), 청구율=pct(row[3]);
    const 지급=toNum(row[4]),     공제=toNum(row[5]), 최종지급=toNum(row[6]);
    const 지급율=pct(row[7]),     공헌이익=toNum(row[8]), 공헌율=pct(row[9]);

    if (청구 === 0 && 시공결과 === 0) continue; // 빈 행 스킵

    result[cur].push(RR(m, 시공결과, 청구, 청구율, 지급, 공제, 최종지급, 지급율, 공헌이익, 공헌율));
  }
  return result;
}

let DATA=FALLBACK, curBrand="레터스 전체", curView="overview";

function fmt(v){
  if(v===null||v===undefined) return "-";
  const r=Math.round(v);
  if(Math.abs(r)>=10000) return(r/10000).toFixed(1)+"억";
  if(Math.abs(r)>=1000)  return(r/1000).toFixed(1)+"천";
  return r.toLocaleString();
}
function fmtAmt(v){
  if(v===null||v===undefined) return "-";
  return Math.round(v).toLocaleString();
}
function fmtPct(v){
  if(v===null||v===undefined) return "-";
  return parseFloat(v).toFixed(2)+"%";
}
function fmtTrend(t){
  if(t===undefined||t===null) return "";
  const n=t<0;
  return`<div class="kpi-trend ${n?"down":"up"}">${n?"▼":"▲"} ${Math.abs(t).toFixed(2)}%p</div>`;
}

function setStatus(s){
  const b=document.getElementById("statusBadge"),t=document.getElementById("statusText"),r=document.getElementById("refreshBtn");
  b.className="status "+s;
  t.textContent=s==="live"?"실시간":s==="loading"?"연결 중":"내장 데이터";
  r.style.display=s==="live"?"none":"inline-block";
}

async function fetchSheet(){
  setStatus("loading");
  try{
    const APPS_SCRIPT_URL="https://script.google.com/macros/s/AKfycbwzy4-nQWhHWYClfR0X-ney5AR8S8FbC-4hbiyo4w13373RsXUGCiIr1it2sjA3QOcl/exec";
    const res=await fetch(APPS_SCRIPT_URL);
    if(!res.ok) throw new Error("fetch failed");
    const txt=await res.text();
    const parsed=parseCSV(txt);
    if(parsed&&Object.keys(parsed).length>0){DATA=parsed;setStatus("live");}
    else setStatus("fallback");
  }catch(e){
    console.warn("시트 연동 실패, fallback 사용:", e);
    setStatus("fallback");
  }
  buildTabs(); buildMonthSelect(); renderSummary();
}

function buildTabs(){
  const el=document.getElementById("brandTabs"); el.innerHTML="";
  Object.keys(DATA).forEach(b=>{
    const btn=document.createElement("button");
    btn.className="tab"+(b===curBrand?" active":"");
    btn.textContent=b;
    btn.style.background=b===curBrand?(BC[b]||"#6366f1"):"white";
    btn.style.color=b===curBrand?"white":"#64748b";
    if(b===curBrand) btn.style.boxShadow=`0 2px 8px ${(BC[b]||"#6366f1")}44`;
    btn.onclick=()=>{curBrand=b;buildTabs();render();};
    el.appendChild(btn);
  });
}

function setView(v,btn){
  curView=v;
  document.querySelectorAll(".view-btn").forEach(b=>b.classList.remove("active"));
  btn.classList.add("active"); render();
}

function toggleLabels(n){
  if(n===1){showLabels1=!showLabels1;document.getElementById("toggle1").classList.toggle("on",showLabels1);}
  else{showLabels2=!showLabels2;document.getElementById("toggle2").classList.toggle("on",showLabels2);}

let curSummaryMonth=null;

function getAllMonths(){
  const s=new Set();
  Object.values(DATA).forEach(a=>a.forEach(d=>{if(d.청구>0)s.add(d.m)}));
  return Array.from(s).sort();
}

function buildMonthSelect(){
  const sel=document.getElementById("monthSelect"), months=getAllMonths();
  if(!months.length) return;
  if(!curSummaryMonth||!months.includes(curSummaryMonth)) curSummaryMonth=months[months.length-1];
  sel.innerHTML=months.map(m=>{const[y,mo]=m.split("-");return`<option value="${m}" ${m===curSummaryMonth?"selected":""}>${"20"+y}년 ${parseInt(mo)}월</option>`;}).join("");
}

function changeMonth(dir){
  const months=getAllMonths(), idx=months.indexOf(curSummaryMonth), next=idx+dir;
  if(next>=0&&next<months.length){curSummaryMonth=months[next];document.getElementById("monthSelect").value=curSummaryMonth;renderSummary();}
}

      <td style="padding:7px 6px;text-align:right">${fmtAmt(d.최종지급)}</td>
      <td style="padding:7px 6px;text-align:right;color:#8b5cf6">${d.지급율>0?fmtPct(d.지급율):"-"}</td>
      <td style="padding:7px 6px;text-align:right;font-weight:700;color:${pc(d.공헌이익)}">${d.공헌이익>=0?fmtAmt(d.공헌이익):"("+fmtAmt(Math.abs(d.공헌이익))+")"}</td>
      <td style="padding:7px 6px;text-align:right;font-weight:700;color:${pc(d.공헌율)}">${fmtPct(d.공헌율)}</td></tr>`;
  });
  html+="</tbody></table>"; ta.innerHTML=html;
}

// 초기화
window.addEventListener('DOMContentLoaded', function(){
  fetchSheet(); // 구글시트 연동 시도 (완료 후 render 포함)
});
</script>
</body>
